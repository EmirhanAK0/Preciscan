syntax = "proto3";
package preciscan;

enum MsgId {
  MSG_UNKNOWN = 0;
  MSG_PING = 1;
  MSG_PONG = 2;
  MSG_HEARTBEAT = 3;
  MSG_HEARTBEAT_ACK = 4;
  MSG_ESTOP = 5;
  MSG_CLEAR_FAULT = 6;
  MSG_HOME = 7;
  MSG_MOVE_ABS = 8;
  MSG_MOVE_REL = 9;
  MSG_JOG = 10;
  MSG_SCAN_START = 11;
  MSG_SCAN_STOP = 12;
  MSG_GET_STATUS = 13;
  MSG_SET_PARAM = 14;
  MSG_STATUS = 15;
  MSG_FAULT = 16;
  MSG_LIMIT_HIT = 17;
  MSG_TRIGGER_EVENT = 18;
}

message TriggerEvent {
  uint32 session_id = 1;
  uint32 seq = 2;
  uint32 encoder_count = 3;
  int32 angle_mdeg = 4;
  uint64 tick_us = 5;
}

message ScanStart {
  uint32 scan_id = 1;
  uint32 step_angle_mdeg = 2;
  int32 z_start_um = 3;
  int32 z_end_um = 4;
  uint32 z_step_um = 5;
  uint32 trigger_step_counts = 6;
  bool enable_trigger = 7;
}

message Envelope {
  MsgId msg_id = 1;
  bytes payload = 2;
}